name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache Hugging Face data/models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('requirements.txt') }}

      # CPU-only torch first (much smaller than the default CUDA wheels);
      # the full requirements.txt then installs on top, so every module
      # (common, baselines, finetune, llm, app) can be imported in CI.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.1.2 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # Catches syntax errors in every package, including ones without tests yet.
      - name: Compile all sources
        run: python -m compileall -q app baselines common finetune llm tests

      - name: Run tests
        run: python -m pytest tests/ -v --cov=. --cov-report=term-missing

  no-ai-attribution:
    name: no-ai-attribution
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block Claude/AI co-author trailers and tracked .claude files
        run: |
          range="origin/${{ github.base_ref }}..HEAD"
          if git log "$range" --format=%B%n%an%n%ae | grep -iE "co-authored-by:.*(claude|anthropic)|noreply@anthropic\.com|generated with \[?claude"; then
            echo "::error::Commits must be authored only by the repo user - remove Claude/AI attribution."
            exit 1
          fi
          if git ls-files | grep -E "^\.claude/"; then
            echo "::error::.claude/ must not be committed."
            exit 1
          fi
